[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-retail-analytics"
version = "0.1.0"
description = "AI Retail Analytics Platform (ARAP) - computer vision retail analytics"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["ai*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "smoke: model-based tests (download model and run inference)",
    "integration: tests that wire multiple components together",
]
