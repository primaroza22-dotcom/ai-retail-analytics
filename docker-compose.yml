# ARAP production stack: PostgreSQL + backend + frontend.
# The backend runs a single uvicorn worker (camera workers are in-process).
#
# Usage:
#   POSTGRES_PASSWORD=... docker compose up --build
#
# For an EXTERNAL PostgreSQL server, omit the postgres service and set
# DATABASE_URL in the backend environment instead.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-arap}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-arap}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-arap}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-arap}
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: INFO
      ANALYTICS_TIMEZONE: ${ANALYTICS_TIMEZONE:-UTC}
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
